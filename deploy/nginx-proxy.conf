# 测试部署的静态站点与本地 next dev 使用同一组前端路径。
# /bapi、/agric-api、/admin-api 走正式业务网关；/satellite-api 保留测试网关。
# 如果静态文件由外层 Nginx 托管，请将下面四个 location 同步到外层 server 配置。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 统一补齐尾斜杠，避免网关对无斜杠路径返回不一致的结果。
    location = /bapi {
        return 308 /bapi/;
    }

    location ^~ /bapi/ {
        proxy_pass https://joint-venture.cdfinance.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name joint-venture.cdfinance.com.cn;
        proxy_set_header Host joint-venture.cdfinance.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /agric-api {
        return 308 /agric-api/;
    }

    location ^~ /agric-api/ {
        proxy_pass https://joint-venture.cdfinance.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name joint-venture.cdfinance.com.cn;
        proxy_set_header Host joint-venture.cdfinance.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /admin-api {
        return 308 /admin-api/;
    }

    location ^~ /admin-api/ {
        proxy_pass https://joint-venture.cdfinance.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name joint-venture.cdfinance.com.cn;
        proxy_set_header Host joint-venture.cdfinance.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    location = /satellite-api {
        return 308 /satellite-api/;
    }

    location ^~ /satellite-api/ {
        proxy_pass https://joint-venture-test.cdfinance.com.cn;
        proxy_ssl_server_name on;
        proxy_ssl_name joint-venture-test.cdfinance.com.cn;
        proxy_set_header Host joint-venture-test.cdfinance.com.cn;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
    }

    # Next 静态导出已经生成各页面目录；缺失扩展名时继续尝试 HTML，兼容带尾斜杠和根路径访问。
    location / {
        try_files $uri $uri/ $uri.html /index.html;
    }
}
